<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Martha's Flowers</title>
  <meta name="description" content="Review the bouquets in your cart.">
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

<body data-page="cart">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <p class="announce">Free wrapping on orders over $80 · Same-day if you order before noon</p>
    <div class="bar wrap">
      <button class="icon-btn menu-btn" type="button" data-nav-open aria-expanded="false" aria-controls="site-nav">Menu</button>
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true"></span> Martha's Flowers</a>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="shop.html">Shop</a>
        <a href="shop.html?price=0-80">Deals</a>
        <a href="shop.html?sort=newest">What's new</a>
        <a href="about.html#delivery">Delivery</a>
      </nav>
      <form class="search" role="search" action="shop.html" method="get">
        <label class="sr-only" for="site-search">Search bouquets</label>
        <input id="site-search" name="q" type="search" placeholder="Search bouquets" data-header-search>
      </form>
      <div class="tools">
        <button class="icon-btn search-btn" type="button" data-search-open aria-expanded="false" aria-controls="site-search">Search</button>

      <p>214 Oak Street<br>Oakton</p>
    </div>
    <div class="wrap"><p class="legal">© 2026 Martha's Flowers. No orders are charged.</p></div>
  </footer>
