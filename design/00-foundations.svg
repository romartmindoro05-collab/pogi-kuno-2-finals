  <text x="360" y="560" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1f6a34">Save</text>
  <text x="64" y="620" font-family="Segoe UI, sans-serif" font-size="14" fill="#667064">Shop bouquets and Add to cart.</text>
