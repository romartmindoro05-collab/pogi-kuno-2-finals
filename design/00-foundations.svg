  <text x="64" y="496" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#171c18">Components</text>
  <rect x="64" y="530" width="180" height="48" rx="24" fill="#2f8a45"/>
  <text x="154" y="560" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Add to cart</text>
