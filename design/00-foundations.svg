  <rect x="660" y="104" width="580" height="320" rx="16" fill="#ffffff"/>
  <text x="684" y="146" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#171c18">Color</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#171c18">
    <rect x="684" y="170" width="64" height="40" fill="#f6f7f4" stroke="#d9ddd4"/><text x="760" y="196">neutral 100</text>
    <rect x="684" y="222" width="64" height="40" fill="#8d9688"/><text x="760" y="248">neutral 500</text>
    <rect x="684" y="274" width="64" height="40" fill="#171c18"/><text x="760" y="300">neutral 900</text>
    <rect x="684" y="326" width="64" height="40" fill="#d9ddd4"/><text x="760" y="352">line</text>
    <rect x="960" y="170" width="64" height="40" fill="#2f8a45"/><text x="1036" y="196">primary</text>
    <rect x="960" y="222" width="64" height="40" fill="#f0c14d"/><text x="1036" y="248">secondary</text>
    <rect x="960" y="274" width="64" height="40" fill="#c43b3b"/><text x="1036" y="300">danger</text>
    <rect x="960" y="326" width="64" height="40" fill="#1e7a4d"/><text x="1036" y="352">success</text>
