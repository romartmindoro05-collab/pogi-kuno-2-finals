  <text x="40" y="76" font-family="Segoe UI, sans-serif" font-size="14" fill="#667064">Type, colors, and buttons.</text>
  <rect x="40" y="104" width="580" height="320" rx="16" fill="#ffffff"/>
  <text x="64" y="146" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#171c18">Type</text>
  <text x="64" y="210" font-family="Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#171c18">Display</text>
  <text x="64" y="258" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#171c18">Heading</text>
  <text x="64" y="300" font-family="Segoe UI, sans-serif" font-size="16" fill="#2c332e">Body. Stories, form help, and the cart.</text>
  <text x="64" y="340" font-family="Segoe UI, sans-serif" font-size="12" letter-spacing="1.4" fill="#667064">CAPTION</text>
